<link rel="stylesheet" href="_shared.css">
<style>
  .head { display: flex; align-items: flex-end; justify-content: space-between; padding-top: 6px; }
  .head .eyebrow { margin-bottom: 4px; }
  .hero {
    position: relative; height: 356px; border-radius: 22px; overflow: hidden; color: #fff;
    background:
      radial-gradient(120% 80% at 85% 10%, rgba(255,255,255,.28), transparent 60%),
      linear-gradient(160deg, #3fc8c0 0%, #2a6ff0 55%, #1d3fb8 100%);
    box-shadow: 0 18px 40px rgba(37, 80, 200, 0.28);
    display: flex; flex-direction: column;
  }
  .hero .copy { padding: 22px 22px 0; display: flex; flex-direction: column; gap: 4px; }
  .hero .kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; opacity: .8; }
  .hero h2 { font: 800 34px/1.05 var(--display); letter-spacing: -0.02em; text-wrap: balance; }
  .hero .art { flex: 1; position: relative; }
  .hero .art .drop {
    position: absolute; left: 50%; top: 50%; width: 128px; height: 128px; transform: translate(-50%, -52%);
    filter: drop-shadow(0 20px 30px rgba(10, 30, 120, .35));
  }
  .hero .art .build {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    font: 600 13px var(--mono); opacity: .75; white-space: nowrap;
  }
  .hero .strip {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    background: rgba(10, 25, 90, 0.28); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  }
  .hero .strip .meta { flex: 1; display: flex; flex-direction: column; }
  .hero .strip .name { font-weight: 600; font-size: 16px; }
  .hero .strip .line { font-size: 13px; opacity: .75; }
  .hero .strip .get { background: rgba(255,255,255,.95); color: #1d4fd8; }
  .shelf { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .tile { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 14px 10px 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center; }
  .tile .name { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .tile .line { font-size: 12px; color: var(--ink-2); margin-top: -6px; }
  .tile .get { min-width: 0; width: 100%; padding: 5px 0; font-size: 14px; }
</style>
</head>
